apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: build-and-push-docker-
  labels:
    argo.slsa.io/enable: "true"
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: revision
        value: main
  volumes:
    - name: kaniko-secret
      secret:
        secretName: docker-hub-credentials    # name of an existing k8s secret
        items:
          - key: .dockerconfigjson
            path: config.json
  templates:
  - name: main
    inputs:
      parameters:
        - name: revision
    steps:
      - - name: build-and-push
          template: build-and-push
          arguments:
            parameters:
              - name: image
                value: "{{item.image}}"
              - name: context
                value: "{{item.context}}"
              - name: revision
                value: "{{inputs.parameters.revision}}"
          withItems:
            - { image: "1234thariq/hello-world-1:0.1.0", context: "/source/test/build-src/docker/hello-world-1" }
            - { image: "1234thariq/hello-world-2:0.1.0", context: "/source/test/build-src/docker/hello-world-2" }

  - name: build-and-push
    inputs:
      parameters:
        - name: image
        - name: context
        - name: revision
      artifacts:
        - name: git-source
          path: /source
          git:
            repo: https://github.com/MohomedThariq/argo-supply-chain-security.git
            revision: "{{inputs.parameters.revision}}"
    outputs:
      parameters:
        - name: OCI
          valueFrom:
            path: /tmp/oci.txt
    container:
      image: gcr.io/kaniko-project/executor:v1.23.1-debug
      command: ["/busybox/sh", "-c"]
      args: 
        - |
          mkdir -p /tmp
          cd {{inputs.parameters.context}}
          executor --context=./ --dockerfile=./Dockerfile --destination="{{inputs.parameters.image}}" --digest-file="/tmp/digest.txt"

          echo "{{inputs.parameters.image}}@$(cat /tmp/digest.txt)" > /tmp/oci.txt
      volumeMounts:
      - name: kaniko-secret
        mountPath: "/kaniko/.docker"
